<!DOCTYPE html>
<html>
<head>
    <title>지진 & 판 경계 시각화</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; }
        #sidebar { width: 350px; height: 100%; overflow-y: auto; border-right: 1px solid #ccc; background: #f8f9fa; }
        .sidebar-header { padding: 15px; background: #2c3e50; color: white; position: sticky; top: 0; z-index: 100; }
        #map { flex: 1; height: 100%; background: #f0f0f0; }
        .eq-item { padding: 12px; border-bottom: 1px solid #ddd; cursor: pointer; display: flex; align-items: center; }
        .eq-item:hover { background: #edf2f7; }
        .mag-badge { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; color: white; flex-shrink: 0; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3 style="margin:0">USGS 실시간 지진 감시</h3>
            <div id="count" style="font-size: 0.8em; margin-top:5px;">데이터 불러오는 중...</div>
        </div>
        <div id="eq-list"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 지도 초기화
        const map = L.map('map').setView([20, 0], 2);
        
        // 배경 지도 (밝은 회색 톤 - 판 경계선이 잘 보이도록)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '©OpenStreetMap, ©CartoDB'
        }).addTo(map);

        const earthquakeApi = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson";
        const platesApi = "https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json";

        function getColor(mag) {
            return mag > 5 ? '#e53e3e' : mag > 4 ? '#ed8936' : mag > 2 ? '#ecc94b' : '#48bb78';
        }

        // 1. 판 경계 데이터 먼저 불러오기 (배경으로 깔기 위해)
        fetch(platesApi)
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: { color: "red", weight: 1.5, opacity: 0.6, dashArray: '5, 5' } // 점선 스타일
                }).addTo(map);
            });

        // 2. 지진 데이터 불러오기
        fetch(earthquakeApi)
            .then(res => res.json())
            .then(data => {
                const listContainer = document.getElementById('eq-list');
                document.getElementById('count').innerText = `${data.features.length} 개의 지진 (최근 24시간)`;

                L.geoJSON(data, {
                    pointToLayer: (feature, latlng) => {
                        const mag = feature.properties.mag;
                        const marker = L.circleMarker(latlng, {
                            radius: mag * 3,
                            fillColor: getColor(mag),
                            color: "#000", weight: 0.5, fillOpacity: 0.8
                        });

                        // 리스트 생성
                        const item = document.createElement('div');
                        item.className = 'eq-item';
                        item.innerHTML = `
                            <div class="mag-badge" style="background:${getColor(mag)}">${mag.toFixed(1)}</div>
                            <div>
                                <div style="font-size:0.9em; font-weight:bold;">${feature.properties.place}</div>
                                <div style="font-size:0.75em; color:gray;">${new Date(feature.properties.time).toLocaleTimeString()}</div>
                            </div>
                        `;
                        item.onclick = () => {
                            map.flyTo(latlng, 7);
                            marker.openPopup();
                        };
                        listContainer.appendChild(item);

                        return marker;
                    },
                    onEachFeature: (feature, layer) => {
                        layer.bindPopup(`<b>${feature.properties.place}</b><br>규모: ${feature.properties.mag}`);
                    }
                }).addTo(map);
            });
    </script>
</body>
</html>
