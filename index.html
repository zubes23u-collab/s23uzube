<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 지진예측모델</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 700px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: #e43f5a;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #cbd5e1;
        }
        .creator {
            font-size: 1rem;
            color: #4ecca3;
            font-weight: bold;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #e43f5a;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #d6304a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI로 제작하는 지진예측모델 홈페이지</h1>
        <p>인공지능 기술을 활용하여 지진 데이터를 분석하고 위험을 예측하는 미래지향적 플랫폼입니다.</p>
        <div class="creator">2026년 경주교육지원청 과학영재반 학생들의 제작</div>
        <br><br>
        <a href="#start" class="btn">모델 시작하기</a>
    </div>
</body>
</html>
