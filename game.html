<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>점프 어드벤처</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #5c94fc;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100%;
  }
  #ui {
    color: white;
    font-size: 20px;
    margin: 10px;
    text-shadow: 2px 2px 0 #000;
    display: flex;
    gap: 30px;
  }
  canvas {
    background: #5c94fc;
    border: 4px solid #000;
    image-rendering: pixelated;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.75);
    color: white;
    font-size: 36px;
    text-shadow: 3px 3px 0 #000;
    z-index: 10;
  }
  #overlay button {
    margin-top: 20px;
    font-size: 18px;
    padding: 10px 20px;
    font-family: 'Courier New', monospace;
    cursor: pointer;
    background: #e52521;
    color: white;
    border: 3px solid #000;
  }
  #hint {
    color: white;
    font-size: 13px;
    margin-top: 6px;
    text-shadow: 1px 1px 0 #000;
  }
</style>
</head>
<body>

<div id="ui">
  <div>점수: <span id="score">0</span></div>
  <div>생명: <span id="lives">3</span></div>
  <div>시간: <span id="time">400</span></div>
</div>

<canvas id="game" width="800" height="448"></canvas>
<div id="hint">← → 이동 | Space / ↑ 점프 | 깃대까지 도착하면 클리어!</div>

<div id="overlay">
  <div id="overlayText">GAME OVER</div>
  <button onclick="restartGame()">다시 시작</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const GRAVITY = 0.6;
const GROUND_Y = H - 64;
const TILE = 32;

let keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.code] = false);

// ---------- Level Data ----------
// x positions are world coordinates
const LEVEL_WIDTH = 3400;

function buildLevel() {
  const platforms = [];
  // main ground with a couple of pits
  const groundSegments = [
    [0, 900],
    [980, 1500],
    [1600, 2200],
    [2320, LEVEL_WIDTH]
  ];
  groundSegments.forEach(([sx, ex]) => {
    platforms.push({ x: sx, y: GROUND_Y, w: ex - sx, h: 64, type: 'ground' });
  });

  // floating blocks
  const blocks = [
    {x: 400, y: GROUND_Y - 130, w: 96, h: 32},
    {x: 700, y: GROUND_Y - 200, w: 64, h: 32},
    {x: 1150, y: GROUND_Y - 110, w: 96, h: 32},
    {x: 1750, y: GROUND_Y - 160, w: 128, h: 32},
    {x: 2000, y: GROUND_Y - 230, w: 64, h: 32},
    {x: 2500, y: GROUND_Y - 130, w: 96, h: 32},
    {x: 2750, y: GROUND_Y - 220, w: 64, h: 32},
  ];
  blocks.forEach(b => platforms.push({...b, type: 'block'}));

  // pipes (obstacles to jump over)
  const pipes = [
    {x: 850, y: GROUND_Y - 60, w: 48, h: 60},
    {x: 1900, y: GROUND_Y - 80, w: 48, h: 80},
    {x: 2650, y: GROUND_Y - 60, w: 48, h: 60},
  ];
  pipes.forEach(p => platforms.push({...p, type: 'pipe'}));

  return platforms;
}

function buildEnemies() {
  return [
    {x: 500, y: GROUND_Y - 32, w: 32, h: 32, vx: -1.5, alive: true, dir: -1},
    {x: 1300, y: GROUND_Y - 32, w: 32, h: 32, vx: -1.5, alive: true, dir: -1},
    {x: 2050, y: GROUND_Y - 32, w: 32, h: 32, vx: -1.5, alive: true, dir: -1},
    {x: 2900, y: GROUND_Y - 32, w: 32, h: 32, vx: -1.5, alive: true, dir: -1},
  ];
}

function buildCoins() {
  return [
    {x: 430, y: GROUND_Y - 170, taken:false},
    {x: 460, y: GROUND_Y - 170, taken:false},
    {x: 1180, y: GROUND_Y - 150, taken:false},
    {x: 1780, y: GROUND_Y - 200, taken:false},
    {x: 1810, y: GROUND_Y - 200, taken:false},
    {x: 2020, y: GROUND_Y - 270, taken:false},
    {x: 2530, y: GROUND_Y - 170, taken:false},
  ];
}

const FLAG_X = LEVEL_WIDTH - 200;

// ---------- Game State ----------
let player, platforms, enemies, coins, camX, score, lives, timeLeft, state, timerAcc, won;

function initGame() {
  player = {
    x: 60, y: GROUND_Y - 48, w: 28, h: 48,
    vx: 0, vy: 0, onGround: false, facing: 1,
    climbing: false, dead: false, invuln: 0
  };
  platforms = buildLevel();
  enemies = buildEnemies();
  coins = buildCoins();
  camX = 0;
  score = 0;
  lives = 3;
  timeLeft = 400;
  timerAcc = 0;
  state = 'playing'; // playing | dead | win | over
  won = false;
  document.getElementById('overlay').style.display = 'none';
  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('time').textContent = Math.max(0, Math.floor(timeLeft));
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function resetPlayerPosition() {
  player.x = Math.max(60, camX + 60);
  player.y = GROUND_Y - 48;
  player.vx = 0;
  player.vy = 0;
  player.climbing = false;
  player.dead = false;
  player.invuln = 90;
}

function loseLife() {
  lives--;
  updateUI();
  if (lives <= 0) {
    state = 'over';
    showOverlay('GAME OVER', '#e52521');
  } else {
    resetPlayerPosition();
  }
}

function showOverlay(text, color) {
  const ov = document.getElementById('overlay');
  const t = document.getElementById('overlayText');
  t.textContent = text;
  t.style.color = color || 'white';
  ov.style.display = 'flex';
}

function restartGame() {
  initGame();
}

// ---------- Update ----------
function update() {
  if (state !== 'playing') return;

  timerAcc++;
  if (timerAcc >= 60) {
    timerAcc = 0;
    timeLeft--;
    updateUI();
    if (timeLeft <= 0) {
      loseLife();
      timeLeft = 400;
    }
  }

  if (player.invuln > 0) player.invuln--;

  if (!player.climbing) {
    // horizontal movement
    const speed = 4;
    if (keys['ArrowLeft']) { player.vx = -speed; player.facing = -1; }
    else if (keys['ArrowRight']) { player.vx = speed; player.facing = 1; }
    else { player.vx *= 0.7; }

    // jump
    if ((keys['Space'] || keys['ArrowUp']) && player.onGround) {
      player.vy = -12.5;
      player.onGround = false;
    }

    // gravity
    player.vy += GRAVITY;
    if (player.vy > 15) player.vy = 15;

    // move x with collision
    player.x += player.vx;
    handleSolidCollisionsX();

    // move y with collision
    player.y += player.vy;
    player.onGround = false;
    handleSolidCollisionsY();

    // fell into pit
    if (player.y > H + 100) {
      loseLife();
    }
  }

  // clamp to level bounds
  if (player.x < camX) player.x = camX;

  // camera follows player
  const targetCam = player.x - 250;
  if (targetCam > camX) camX = targetCam;
  if (camX < 0) camX = 0;
  if (camX > LEVEL_WIDTH - W) camX = LEVEL_WIDTH - W;

  // enemies
  enemies.forEach(en => {
    if (!en.alive) return;
    en.x += en.vx;
    // reverse at pipe/edge roughly: just bounce every 150-250px using simple wall check
    // simple bounds check against nearby platforms to turn around
    const enemyFeet = {x: en.x, y: en.y + en.h, w: en.w, h: 2};
    let onGroundHere = false;
    platforms.forEach(p => {
      if (p.type === 'ground' || p.type==='block') {
        if (enemyFeet.x + enemyFeet.w > p.x && enemyFeet.x < p.x + p.w &&
            Math.abs((en.y + en.h) - p.y) < 6) {
          onGroundHere = true;
        }
      }
    });
    if (!onGroundHere) en.vx *= -1;

    // enemy vs player collision
    if (player.invuln <= 0 && !player.dead && rectsOverlap(player, en)) {
      const stomping = player.vy > 0 && (player.y + player.h) - en.y < 20;
      if (stomping) {
        en.alive = false;
        player.vy = -8;
        score += 100;
        updateUI();
      } else {
        loseLife();
      }
    }
  });

  // coins
  coins.forEach(c => {
    if (c.taken) return;
    const cb = {x: c.x, y: c.y, w: 20, h: 20};
    if (rectsOverlap(player, cb)) {
      c.taken = true;
      score += 50;
      updateUI();
    }
  });

  // flag pole
  if (!won && player.x + player.w >= FLAG_X) {
    won = true;
    player.climbing = true;
    player.x = FLAG_X;
    player.vx = 0;
    player.vy = 2; // slide down animation
  }

  if (player.climbing) {
    player.y += 2;
    if (player.y > GROUND_Y - 48) {
      player.y = GROUND_Y - 48;
      player.climbing = false;
      state = 'win';
      score += 500;
      updateUI();
      showOverlay('STAGE CLEAR!', '#ffd700');
    }
  }
}

function handleSolidCollisionsX() {
  platforms.forEach(p => {
    if (p.type === 'pipe' || p.type === 'block' || p.type === 'ground') {
      if (rectsOverlap(player, p)) {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  });
}

function handleSolidCollisionsY() {
  platforms.forEach(p => {
    if (p.type === 'pipe' || p.type === 'block' || p.type === 'ground') {
      if (rectsOverlap(player, p)) {
        if (player.vy > 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }
  });
}

// ---------- Draw ----------
function drawBackground() {
  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, W, H);
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i = 0; i < 6; i++) {
    const cx = (i * 500 - camX * 0.3) % (LEVEL_WIDTH + 500);
    drawCloud(cx, 60 + (i % 2) * 30);
  }
  // hills
  ctx.fillStyle = '#1e9c1e';
  for (let i = 0; i < 8; i++) {
    const hx = (i * 400 - camX * 0.6) % (LEVEL_WIDTH + 400);
    drawHill(hx, GROUND_Y);
  }
}

function drawCloud(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI * 2);
  ctx.arc(x + 18, y - 8, 18, 0, Math.PI * 2);
  ctx.arc(x + 38, y, 16, 0, Math.PI * 2);
  ctx.fill();
}

function drawHill(x, groundY) {
  ctx.beginPath();
  ctx.moveTo(x - 60, groundY);
  ctx.quadraticCurveTo(x, groundY - 60, x + 60, groundY);
  ctx.fill();
}

function drawPlatforms() {
  platforms.forEach(p => {
    const sx = p.x - camX;
    if (sx + p.w < 0 || sx > W) return;
    if (p.type === 'ground') {
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.fillStyle = '#2e8b2e';
      ctx.fillRect(sx, p.y, p.w, 10);
      // brick pattern
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      for (let i = 0; i < p.w; i += TILE) {
        ctx.strokeRect(sx + i, p.y + 10, TILE, p.h - 10);
      }
    } else if (p.type === 'block') {
      ctx.fillStyle = '#c87137';
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.strokeStyle = '#00000055';
      ctx.strokeRect(sx, p.y, p.w, p.h);
      for (let i = 0; i < p.w; i += 32) {
        ctx.strokeRect(sx + i, p.y, 32, p.h);
      }
    } else if (p.type === 'pipe') {
      ctx.fillStyle = '#1e9c1e';
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.fillStyle = '#166616';
      ctx.fillRect(sx, p.y, p.w, 10);
      ctx.strokeStyle = '#003300';
      ctx.strokeRect(sx, p.y, p.w, p.h);
    }
  });
}

function drawCoins() {
  coins.forEach(c => {
    if (c.taken) return;
    const sx = c.x - camX;
    if (sx < -20 || sx > W + 20) return;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(sx + 10, c.y + 10, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#a67c00';
    ctx.stroke();
  });
}

function drawEnemies() {
  enemies.forEach(en => {
    if (!en.alive) return;
    const sx = en.x - camX;
    if (sx < -40 || sx > W + 40) return;
    ctx.fillStyle = '#8b4513';
    ctx.beginPath();
    ctx.ellipse(sx + en.w/2, en.y + en.h/2, en.w/2, en.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    // eyes
    ctx.fillStyle = 'white';
    ctx.fillRect(sx + 6, en.y + 8, 6, 6);
    ctx.fillRect(sx + 20, en.y + 8, 6, 6);
    ctx.fillStyle = 'black';
    ctx.fillRect(sx + 8, en.y + 10, 3, 3);
    ctx.fillRect(sx + 22, en.y + 10, 3, 3);
    // feet
    ctx.fillStyle = '#5a2d0c';
    ctx.fillRect(sx + 2, en.y + en.h - 6, 8, 6);
    ctx.fillRect(sx + en.w - 10, en.y + en.h - 6, 8, 6);
  });
}

function drawFlag() {
  const sx = FLAG_X - camX;
  if (sx < -50 || sx > W + 50) return;
  // pole
  ctx.fillStyle = '#cccccc';
  ctx.fillRect(sx + 20, GROUND_Y - 260, 6, 260);
  ctx.beginPath();
  ctx.arc(sx + 23, GROUND_Y - 262, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd700';
  ctx.fill();
  // flag
  const flagY = won ? GROUND_Y - 48 - (player.y < GROUND_Y-48 ? 0:0) : GROUND_Y - 240;
  const fy = won ? player.y + 10 : GROUND_Y - 240;
  ctx.fillStyle = '#e52521';
  ctx.beginPath();
  ctx.moveTo(sx + 26, fy);
  ctx.lineTo(sx + 60, fy + 12);
  ctx.lineTo(sx + 26, fy + 24);
  ctx.closePath();
  ctx.fill();
}

function drawPlayer() {
  if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) return; // blink
  const sx = player.x - camX;
  ctx.save();
  ctx.translate(sx + player.w/2, 0);
  ctx.scale(player.facing, 1);
  ctx.translate(-player.w/2, 0);

  // body
  ctx.fillStyle = '#e52521';
  ctx.fillRect(0, player.y + 16, player.w, player.h - 16);
  // head
  ctx.fillStyle = '#ffd9a0';
  ctx.fillRect(4, player.y, player.w - 8, 18);
  // cap
  ctx.fillStyle = '#e52521';
  ctx.fillRect(0, player.y, player.w, 8);
  ctx.fillRect(player.w - 10, player.y + 4, 12, 6);
  // overalls straps
  ctx.fillStyle = '#2255cc';
  ctx.fillRect(0, player.y + 24, player.w, player.h - 24);
  // eyes
  ctx.fillStyle = 'black';
  ctx.fillRect(player.w - 12, player.y + 8, 3, 3);

  ctx.restore();
}

function draw() {
  drawBackground();
  drawPlatforms();
  drawCoins();
  drawFlag();
  drawEnemies();
  drawPlayer();
}

// ---------- Loop ----------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
</html>
